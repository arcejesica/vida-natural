<div class="login-bg">
  <div class="login-card">

    <!-- Logo e ícono -->
    <div class="login-logo">
      <i class="bi bi-tree-fill"></i>
    </div>

    <h1 class="login-title">Vida Natural</h1>
    <p class="login-subtitle">"Accedé a tu cuenta para gestionar tu tienda de productos naturales"</p>

    <h2 class="login-form-title">Iniciar sesión</h2>

    <!-- Mensaje de error global (credenciales incorrectas) -->
    <div *ngIf="mensajeError" class="alert alert-danger alert-vn d-flex align-items-center gap-2 mb-3" role="alert">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span>{{ mensajeError }}</span>
    </div>

    <!-- ===== Formulario reactivo ===== -->
    <form [formGroup]="formulario" (ngSubmit)="onLogin()" novalidate>

      <!-- Campo Email -->
      <div class="mb-3">
        <label for="login-email" class="form-label fw-medium">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-envelope text-muted"></i>
          </span>
          <input
            id="login-email"
            type="email"
            class="form-control border-start-0"
            [class.is-invalid]="email.invalid && email.touched"
            [class.is-valid]="email.valid && email.touched"
            formControlName="email"
            placeholder="admin@vidanatural.com"
            autocomplete="email">
          <div class="invalid-feedback">
            <span *ngIf="email.errors?.['required']">El email es obligatorio.</span>
            <span *ngIf="email.errors?.['email']">Ingresá un formato de email válido.</span>
          </div>
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="mb-4">
        <label for="login-password" class="form-label fw-medium">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input
            id="login-password"
            [type]="mostrarPassword ? 'text' : 'password'"
            class="form-control border-start-0 border-end-0"
            [class.is-invalid]="password.invalid && password.touched"
            [class.is-valid]="password.valid && password.touched"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password">
          <!-- Botón para mostrar/ocultar contraseña -->
          <button
            type="button"
            class="input-group-text bg-white border-start-0"
            (click)="togglePassword()"
            tabindex="-1"
            title="Mostrar/ocultar contraseña">
            <i class="bi" [class.bi-eye]="!mostrarPassword" [class.bi-eye-slash]="mostrarPassword" class="text-muted"></i>
          </button>
          <div class="invalid-feedback">
            <span *ngIf="password.errors?.['required']">La contraseña es obligatoria.</span>
            <span *ngIf="password.errors?.['minlength']">Debe tener al menos 6 caracteres.</span>
          </div>
        </div>
      </div>

      <!-- Botón Ingresar -->
      <button
        type="submit"
        id="btn-ingresar"
        class="btn btn-vn-primary w-100 d-flex align-items-center justify-content-center gap-2"
        [disabled]="cargando">

        <!-- Angular Material: spinner de carga -->
        <mat-spinner *ngIf="cargando" [diameter]="20" color="accent"></mat-spinner>

        <span *ngIf="!cargando">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
        </span>
        <span *ngIf="cargando">Verificando...</span>
      </button>

    </form>

    <!-- Acceso rápido — discreto, pequeño, al pie -->
    <div class="demo-acceso mt-3">
      <span class="demo-acceso-label">Acceso rápido:</span>
      <button
        type="button"
        class="demo-btn"
        (click)="formulario.patchValue({email:'admin@vidanatural.com', password:'admin123'})">
        <i class="bi bi-shield-check"></i> Admin
      </button>
      <button
        type="button"
        class="demo-btn"
        (click)="formulario.patchValue({email:'usuario@vidanatural.com', password:'usuario123'})">
        <i class="bi bi-person"></i> Usuario
      </button>
    </div>

  </div>
</div>
